# Linux acceptance: installs RA on an Ubuntu runner (a Linux container),
# runs one real cloud coding task end-to-end, verifies sandbox behavior,
# and drives the full-screen TUI through a real PTY.
name: linux-acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Install system deps (bubblewrap = sandbox backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap python3
      - name: Install RA as a user
        run: |
          ./install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Cloud config
        run: |
          python3 - <<'PY'
          import json
          base = json.load(open("anubis/ra.json"))
          base["profile"] = "linux-acceptance"
          base.pop("tier_models", None)
          open("/tmp/ra-linux.json", "w").write(json.dumps(base, indent=2))
          PY
      - name: Version + sandbox backend
        run: |
          ra version
          ra sandbox status
      - name: Real coding task (plan → implement → verify, live cloud)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RA_CONFIG: /tmp/ra-linux.json
          RA_MODEL: ollama-cloud/deepseek-v4-pro:0813
          RA_SMALL_MODEL: ollama-cloud/glm-5.3-flash
          RA_ALLOW_UNSANDBOXED: "1"   # CI runners forbid user namespaces; trusted env consents
        run: |
          mkdir -p /tmp/proj && cd /tmp/proj && git init -q
          set +e
          ra run "Create calc.py defining add(a,b) returning a+b and a __main__ block printing add(2,3). Dependency-free." --quick --verify --json > ra-out.json 2> ra-err.txt
          RA_EXIT=$?
          set -e
          echo "=== ra exit: $RA_EXIT; stderr tail ==="; tail -6 ra-err.txt || true
          echo "=== calc.py contents ==="; cat calc.py || true
          echo "=== direct python3 ==="; python3 calc.py; echo "direct exit=$?"
          test -f calc.py && test "$RA_EXIT" -eq 0
      - name: Fail-closed contract (no silent unsandboxed execution)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RA_CONFIG: /tmp/ra-linux.json
        run: |
          cd /tmp/proj
          set +e
          ra sandbox exec -- echo hi > fc-out.txt 2> fc-err.txt
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            grep -q "bubblewrap" <(ra sandbox status) || test -e /etc/ra-outside-probe || true
          else
            grep -qi "No OS command sandbox" fc-err.txt fc-out.txt || (cat fc-err.txt; exit 1)
          fi
      - name: Sandbox exec works with consent
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RA_CONFIG: /tmp/ra-linux.json
          RA_ALLOW_UNSANDBOXED: "1"
        run: |
          cd /tmp/proj
          ra sandbox exec -- sh -c 'echo sandbox-ok' | grep -q sandbox-ok
      - name: Sandbox isolation when bubblewrap is usable (skipped on userns-blocked runners)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RA_CONFIG: /tmp/ra-linux.json
        run: |
          cd /tmp/proj
          if bwrap --ro-bind / / --dev /dev /bin/true 2>/dev/null; then
            if ra sandbox exec -- sh -c 'echo blocked > /etc/ra-outside-probe' 2>/dev/null; then
              test ! -e /etc/ra-outside-probe
            fi
            ra sandbox exec -- sh -c 'echo sandbox-ok' | grep -q sandbox-ok
          else
            echo "user namespaces unavailable on this runner — bwrap isolation covered by desktop-Linux installs"
          fi
      - name: Full-screen TUI through a real PTY
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          RA_CONFIG: /tmp/ra-linux.json
          RA_MODEL: ollama-cloud/deepseek-v4-pro:0813
          RA_SMALL_MODEL: ollama-cloud/glm-5.3-flash
          RA_ALLOW_UNSANDBOXED: "1"
        run: python3 "ra tests/linux_tui_pty.py"
