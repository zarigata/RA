<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anubis — The Osiris Protocol</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #1a1100;
            color: #f5e6c8;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            padding: 50px 20px;
            background: linear-gradient(180deg, #3f2c00 0%, #1a1100 100%);
            border-bottom: 2px solid #fbbf24;
        }
        h1 {
            font-size: 3em;
            color: #fbbf24;
            margin: 0;
            text-shadow: 0 0 10px #000;
        }
        p.lead {
            font-size: 1.2em;
            color: #fef08a;
        }
        .code-block {
            background: #000;
            color: #84cc16;
            padding: 15px;
            border-radius: 5px;
            display: inline-block;
            margin: 20px 0;
            border: 1px solid #fbbf24;
            font-family: 'Courier New', monospace;
        }
        .pipelines {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 40px 20px;
        }
        .role {
            background: #3f2c00;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 20px;
            width: 150px;
            transition: transform 0.3s;
        }
        .role:hover {
            transform: translateY(-5px);
        }
        .role span {
            font-size: 2.5em;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <h1>𓃡 Anubis</h1>
        <p class="lead">The Osiris Protocol — Multi-Agent Engineered for Total Functional Assurance</p>
        <div class="code-block">curl -fsSL https://anubis.dev/install | bash</div>
    </header>
    <section class="pipelines">
        <div class="role"><span>𓁹</span>Thoth</div>
        <div class="role"><span>𓃠</span>Ptah</div>
        <div class="role"><span>⚖️</span>Maat</div>
        <div class="role"><span>𓄿</span>Sekhmet</div>
        <div class="role"><span>𓏟</span>Seshat</div>
    </section>
</body>
</html>
