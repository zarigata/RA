<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How RA turns a vibe into verified code</title>
  <desc id="desc">Flow diagram showing user intent through orchestration, context, routing, agents, tools, verification and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0b10"/>
      <stop offset="1" stop-color="#17131b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c79547"/>
    </marker>
  </defs>
  <rect width="1400" height="760" rx="26" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f5e9d1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">From “build this” to verified code</text>
  <text x="70" y="119" fill="#a99b8a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21">RA treats vibe coding as an orchestration problem: context, specialists, tools, verification, recovery.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(70 185)">
      <rect width="240" height="132" rx="22" fill="#17151b" stroke="#8d6738" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">01 · INTENT</text>
      <text x="24" y="78" fill="#f5e9d1" font-size="25" font-weight="800">Your vibe</text>
      <text x="24" y="108" fill="#aaa095" font-size="17">Natural-language goal</text>
    </g>

    <g transform="translate(390 185)">
      <rect width="240" height="132" rx="22" fill="#17151b" stroke="#8d6738" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">02 · ANUBIS</text>
      <text x="24" y="78" fill="#f5e9d1" font-size="25" font-weight="800">Orchestrate</text>
      <text x="24" y="108" fill="#aaa095" font-size="17">Plan · split · budget</text>
    </g>

    <g transform="translate(710 185)">
      <rect width="240" height="132" rx="22" fill="#17151b" stroke="#8d6738" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">03 · CONTEXT</text>
      <text x="24" y="78" fill="#f5e9d1" font-size="25" font-weight="800">Pack the right data</text>
      <text x="24" y="108" fill="#aaa095" font-size="17">Repo · memory · limits</text>
    </g>

    <g transform="translate(1030 185)">
      <rect width="300" height="132" rx="22" fill="#17151b" stroke="#8d6738" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">04 · PROVIDER MOSAIC</text>
      <text x="24" y="78" fill="#f5e9d1" font-size="25" font-weight="800">Pick the right brain</text>
      <text x="24" y="108" fill="#aaa095" font-size="17">Local · LAN · cloud · fallback</text>
    </g>

    <line x1="310" y1="251" x2="382" y2="251" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="630" y1="251" x2="702" y2="251" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="950" y1="251" x2="1022" y2="251" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(130 400)">
      <rect width="300" height="145" rx="22" fill="#14141a" stroke="#61503a" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">05 · AGENT LEGION</text>
      <text x="24" y="79" fill="#f5e9d1" font-size="24" font-weight="800">Specialists collaborate</text>
      <text x="24" y="111" fill="#aaa095" font-size="17">Thoth · Ptah · Ma’at · Sekhmet</text>
    </g>

    <g transform="translate(550 400)">
      <rect width="300" height="145" rx="22" fill="#14141a" stroke="#61503a" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">06 · TOOLS</text>
      <text x="24" y="79" fill="#f5e9d1" font-size="24" font-weight="800">Build in the real repo</text>
      <text x="24" y="111" fill="#aaa095" font-size="17">Read · edit · shell · MCP · Git</text>
    </g>

    <g transform="translate(970 400)">
      <rect width="300" height="145" rx="22" fill="#14141a" stroke="#61503a" stroke-width="2"/>
      <text x="24" y="42" fill="#eac981" font-size="18" font-weight="700">07 · VERIFY</text>
      <text x="24" y="79" fill="#f5e9d1" font-size="24" font-weight="800">Prove the result</text>
      <text x="24" y="111" fill="#aaa095" font-size="17">Tests · critics · diagnostics</text>
    </g>

    <line x1="1180" y1="317" x2="1180" y2="365" stroke="#c79547" stroke-width="3"/>
    <line x1="1180" y1="365" x2="280" y2="365" stroke="#c79547" stroke-width="3"/>
    <line x1="280" y1="365" x2="280" y2="392" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="430" y1="472" x2="542" y2="472" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="850" y1="472" x2="962" y2="472" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="234" y="623" width="932" height="80" rx="22" fill="#1c1714" stroke="#a97735" stroke-width="2"/>
    <text x="700" y="655" text-anchor="middle" fill="#f4d58f" font-size="19" font-weight="700">CHECKPOINT · HANDOFF · RESUME · ESCALATE ONLY WHEN NEEDED</text>
    <text x="700" y="683" text-anchor="middle" fill="#b3a99e" font-size="17">Long tasks survive context pressure instead of simply dying at the token wall.</text>

    <line x1="1120" y1="545" x2="1120" y2="585" stroke="#c79547" stroke-width="3"/>
    <line x1="1120" y1="585" x2="700" y2="585" stroke="#c79547" stroke-width="3"/>
    <line x1="700" y1="585" x2="700" y2="615" stroke="#c79547" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>