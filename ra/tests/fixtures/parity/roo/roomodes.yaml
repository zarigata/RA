# Roo Code custom modes — canonical YAML form (docs.roocode.com/features/custom-modes)
# .roomodes may be YAML or JSON at project root; global twin: ~/Library/Application Support/Code/User/globalStorage/rooveterinaryinc.roo-cline/settings/custom_modes.yaml
customModes:
  - slug: docs-writer
    name: 📝 Documentation Writer
    description: A specialized mode for writing and editing technical documentation.
    roleDefinition: You are a technical writer specializing in clear documentation.
    whenToUse: Use this mode for writing and editing documentation.
    customInstructions: Focus on clarity and completeness in documentation.
    groups:
      - read
      - - edit
        - fileRegex: \.(md|mdx)$
          description: Markdown files only
  - slug: reviewer
    name: Code Reviewer
    roleDefinition: You are a strict code reviewer.
    groups: ["read", "edit", "command"]
